      "stripe_secret_key_help": "In the Stripe account picker, open the intended sandbox, then API keys. Copy the secret API key (sk_test_ for testing; sk_live_ for real payments). Do not use the publishable pk_ key or the webhook whsec_ secret here. Restricted rk_ keys require permissions for the payment integration, including read access to /v1/account and /v1/balance for connection checks. Enter secrets only in these settings, never in AI help or support messages.",
      "stripe_webhook_secret_help": "In Stripe Workbench → Webhooks, open the destination for this LMS and copy its signing secret beginning whsec_. The destination and secret API key must belong to the same account and sandbox or live environment. The whsec_ prefix alone does not identify the environment. Use the secret of the registered destination, not a local Stripe CLI listener secret.",
      "setup_help_heading": "Stripe setup and troubleshooting",
      "webhook_setup_help": "In the same Stripe environment as the API key, create a webhook destination for Your account with Snapshot payloads. Use %{url} and API version %{version}. Subscribe to these events: %{events}. A successful settings save does not verify this destination; check event delivery and processing after a test purchase.",
      "card_methods_help": "Enable Cards in the Stripe payment-method settings for the same environment. The LMS filters Checkout to card payments; enabling other methods in Stripe does not add support for them in the LMS.",
      "sandbox_help": "For a sandbox purchase, enter test card 4242 4242 4242 4242, a future expiry date and any three-digit security code in the card form. Do not use a real card. No money moves. Test as a student without existing course access, then verify successful payment, return to the LMS and course access. This does not replace refund, dispute and recovery testing before live sales.",
      "checkout_help": "If new purchases are unavailable, check Enable payments, configuration warnings, matching course currency and the HTTPS App URL under Integration. If setup is complete, inspect the failed request in Stripe Workbench → Logs and share only the error code and message with support. An idempotency error needs investigation of the existing attempt; do not delete purchase history or manually replace its key.",
      "health_help": "Payment worker status indicates whether the default queue worker is running, not whether a payment succeeded. Last processed event records webhook processing; a blank value means none has been recorded. Recovery dispatch records the recovery scheduler. Live checkout requires a dispatch within the last ten minutes. Investigate old pending events and purchases needing review before asking a learner to pay again.",
