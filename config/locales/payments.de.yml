      "stripe_secret_key_help": "Öffnen Sie in der Stripe-Kontoauswahl die gewünschte Sandbox und dann API-Schlüssel. Kopieren Sie den geheimen API-Schlüssel (sk_test_ für Tests; sk_live_ für echte Zahlungen). Verwenden Sie hier weder den öffentlichen pk_-Schlüssel noch das whsec_-Webhook-Geheimnis. Eingeschränkte rk_-Schlüssel benötigen Berechtigungen für die Zahlungsintegration, einschließlich Lesezugriff auf /v1/account und /v1/balance für die Verbindungsprüfung. Geben Sie Geheimnisse nur in diesen Einstellungen ein, niemals in KI-Hilfe oder Support-Nachrichten.",
