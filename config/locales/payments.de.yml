      "checkout_help": "Wenn neue Käufe nicht verfügbar sind, prüfen Sie Zahlungen aktivieren, Konfigurationshinweise, übereinstimmende Kurswährung und die HTTPS-App-URL unter Integration. Ist die Einrichtung vollständig, prüfen Sie die fehlgeschlagene Anfrage in Stripe Workbench → Logs und teilen Sie dem Support nur Fehlercode und Fehlermeldung mit. Bei einem Idempotenzfehler muss der bestehende Versuch untersucht werden; löschen Sie keinen Kaufverlauf und ersetzen Sie seinen Schlüssel nicht manuell.",
      "health_help": "Der Worker-Status zeigt, ob ein Worker für die Standardwarteschlange läuft, nicht ob eine Zahlung erfolgreich war. Das zuletzt verarbeitete Ereignis erfasst die Webhook-Verarbeitung; ein leerer Wert bedeutet, dass noch keine erfasst wurde. Der Wiederherstellungslauf erfasst den Scheduler. Live-Checkout erfordert einen Lauf innerhalb der letzten zehn Minuten. Untersuchen Sie alte ausstehende Ereignisse und zu prüfende Käufe, bevor Sie Lernende erneut zur Zahlung auffordern.",
