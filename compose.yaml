# One Compose project per LMS instance. deploy/lib/instance.sh derives the
# project name: "ai_lms" for the default instance, "ai_lms_<instance>" otherwise.
# Scripts always pass -p as well; the fallback keeps manual commands safe.
name: "${COMPOSE_PROJECT_NAME:-ai_lms}"

x-app: &app
  image: "${APP_IMAGE:?APP_IMAGE must identify the release image}"
  build:
    context: .
  env_file:
    - "${DEPLOY_ROOT:-/opt/ai_lms}/shared/.env"
  environment:
    DATABASE_URL: "postgresql://ai_lms:${POSTGRES_PASSWORD}@db:5432/ai_lms_production"
    REDIS_URL: "redis://redis:6379/0"
  volumes:
    - storage:/rails/storage
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ai_lms_production
      POSTGRES_USER: ai_lms
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_lms -d ai_lms_production"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      edge:
        # The shared edge proxy reaches this instance by this alias.
        aliases:
          - "${EDGE_UPSTREAM:-lms-default-web}"
      backend: {}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *app
    command: ["bundle", "exec", "sidekiq"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

networks:
  # Created by deploy/server and shared with the edge proxy (deploy/edge).
  edge:
    name: ai_lms_edge
    external: true
  backend:

# Prefixed with the project name so instances never share data. The default
# instance keeps the original ai_lms_* names.
volumes:
  postgres:
    name: "${COMPOSE_PROJECT_NAME:-ai_lms}_postgres"
  redis:
    name: "${COMPOSE_PROJECT_NAME:-ai_lms}_redis"
  storage:
    name: "${COMPOSE_PROJECT_NAME:-ai_lms}_storage"
